    <script>
      (function() {
        
        window.addEventListener('error', function(event) {
          if (
            (event.filename && event.filename.includes('chrome-extension://')) ||
            (event.message && event.message.includes('fetch of #<Window> which has only a getter'))
          ) {
            event.stopImmediatePropagation();
            event.preventDefault();
            return true;
          }
        }, true);

        
        try {
          var _currentFetch = window.fetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return _currentFetch;
            },
            set: function(fn) {
              _currentFetch = fn;
            },
            configurable: true,
            enumerable: true
          });
        } catch (_) {}
      })();
    </script>
